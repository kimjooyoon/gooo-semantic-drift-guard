name: immutable release evidence

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build, test, and collect evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unsupported release tag: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release already exists; refusing to replace immutable release"
            exit 1
          fi
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          tag_object=$(printf '%s' "${tag_ref}" | jq -r '.object.sha')
          tag_type=$(printf '%s' "${tag_ref}" | jq -r '.object.type')
          test "${tag_type}" = "tag"
          tag_target=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.object.sha')
          test "${tag_target}" = "${GITHUB_SHA}"
          build_started=$(date +%s%3N)
          go build ./...
          build_ms=$(( $(date +%s%3N) - build_started ))
          test_started=$(date +%s%3N)
          go test ./...
          test_ms=$(( $(date +%s%3N) - test_started ))
          evidence_dir="${RUNNER_TEMP}/gooo-semantic-drift-guard-evidence"
          go run ./cmd/gooo-semantic-drift-guard conformance \
            -root . \
            -fixtures fixtures/cases \
            -output-dir "${evidence_dir}/conformance" \
            -build-ms "${build_ms}" \
            -test-ms "${test_ms}" \
            -tests-total 12 \
            -tests-executed 12 \
            -tests-reused 0 \
            -tests-skipped 0 \
            -tests-not-observed 0
          printf 'release_tag=%s\ntarget_commit=%s\ntag_object=%s\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${tag_object}" \
            > "${evidence_dir}/release-metadata.txt"
          tar -C "${evidence_dir}" -czf "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz" > "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz.sha256"
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "Immutable conformance evidence for ${GITHUB_SHA}." \
            "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz" \
            "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz.sha256"
          test "$(gh release view "${GITHUB_REF_NAME}" --json isImmutable --jq '.isImmutable')" = "true"
