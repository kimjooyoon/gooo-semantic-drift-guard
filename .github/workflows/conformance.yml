name: conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@v4
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build, test, and conformance
        shell: bash
        run: |
          set -euo pipefail
          build_started=$(date +%s%3N)
          go build ./...
          build_ms=$(( $(date +%s%3N) - build_started ))
          test_started=$(date +%s%3N)
          go test ./...
          test_ms=$(( $(date +%s%3N) - test_started ))
          go vet ./...
          go_files=$(git ls-files '*.go')
          test -z "$(gofmt -d ${go_files})"
          generated_dir=$(mktemp -d)
          go run ./cmd/gooo-semantic-drift-guard compile \
            -source examples/semantic-drift-guard/main.gooo \
            -contract contracts/semantic-drift-guard-denominator-v1.json \
            -output-ir "${generated_dir}/semantic-ir.json" \
            -output-go "${generated_dir}/semantic.gooo.go"
          cmp "${generated_dir}/semantic-ir.json" internal/generated/semantic-ir.json
          cmp "${generated_dir}/semantic.gooo.go" internal/generated/semantic.gooo.go
          conformance_dir="${RUNNER_TEMP}/gooo-semantic-drift-guard-conformance"
          go run ./cmd/gooo-semantic-drift-guard conformance \
            -root . \
            -fixtures fixtures/cases \
            -output-dir "${conformance_dir}" \
            -build-ms "${build_ms}" \
            -test-ms "${test_ms}" \
            -tests-total 12 \
            -tests-executed 12 \
            -tests-reused 0 \
            -tests-skipped 0 \
            -tests-not-observed 0
          cat "${conformance_dir}/ci-summary.md" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-semantic-drift-guard-conformance
          path: ${{ runner.temp }}/gooo-semantic-drift-guard-conformance
          if-no-files-found: warn
